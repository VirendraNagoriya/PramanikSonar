<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Gold Products</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body { font-family: Arial, sans-serif; margin: 20px; }
h2 { text-align: center; color: #800000; }
.controls { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-bottom: 20px; }
.controls input, .controls select, .controls button { padding: 10px; border-radius: 8px; border: 1px solid #ccc; font-size: 14px; }
table { width: 100%; border-collapse: collapse; margin-top: 10px; }
th, td { border: 1px solid #ddd; padding: 10px; text-align: center; font-size: 14px; }
th { background-color: #800000; color: white; }
img { max-width: 60px; border-radius: 6px; }
button { padding: 6px 12px; border: none; border-radius: 6px; cursor: pointer; }
.active-btn { background: green; color: #fff; }
.inactive-btn { background: red; color: #fff; }
.modal { display: none; position: fixed; z-index: 999; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
.modal-content { background: #fff; padding: 20px; border-radius: 10px; width: 90%; max-width: 400px; position: relative; }
.modal-content input, .modal-content select, .modal-content textarea { width: 100%; margin: 8px 0; padding: 8px; border: 1px solid #ccc; border-radius: 6px; }
.modal-content button { width: 100%; padding: 10px; background: #800000; color: #fff; cursor: pointer; }
.close-btn { position: absolute; top: 10px; right: 15px; font-size: 18px; cursor: pointer; }
@media(max-width:768px){
  table, thead, tbody, th, td, tr { display: block; }
  tr { margin-bottom: 15px; }
  td { text-align: right; padding-left: 50%; position: relative; }
  td::before { content: attr(data-label); position: absolute; left: 10px; width: 45%; padding-left: 10px; font-weight: bold; text-align: left; }
}
</style>
</head>
<body>

<button onclick="logout()">Logout</button>
<h2>Gold Products</h2>

<div class="controls">
  <input type="text" id="searchBar" placeholder="Search by Name / HUID">
  <select id="filterType">
    <option value="">Filter by Jewellery Type</option>
    <option value="Ring">Ring</option>
    <option value="Couple Rings">Couple Rings</option>
    <option value="Necklace">Necklace</option>
    <option value="Bracelet">Bracelet</option>
    <option value="Bangals">Bangals</option>
  </select>
  <button onclick="openModal()">+ Add Product</button>
</div>

<table id="productTable">
<thead>
<tr>
  <th>Images</th>
  <th>Name</th>
  <th>Type</th>
  <th>HUID</th>
  <th>Jewellery Type</th>
  <th>Weight (gm)</th>
  <th>Status</th>
  <th>Description</th>
  <th>Edit</th>
</tr>
</thead>
<tbody></tbody>
</table>

<!-- Modal -->
<div class="modal" id="productModal">
<div class="modal-content">
  <span class="close-btn" onclick="closeModal()">&times;</span>
  <h3 id="modalTitle">Add Product</h3>
  <form id="productForm">
    <input type="hidden" id="pId">
    <input type="text" id="pName" placeholder="Product Name" required>
    <input type="text" id="pType" placeholder="Type" required>
    <input type="text" id="pHuid" placeholder="HUID No" required>
    <select id="pJewelleryType" required>
      <option value="">Select Jewellery Type</option>
      <option value="Ring">Ring</option>
      <option value="Couple Rings">Couple Rings</option>
      <option value="Necklace">Necklace</option>
      <option value="Bracelet">Bracelet</option>
      <option value="Bangals">Bangals</option>
    </select>
    <input type="number" id="pWeight" placeholder="Weight in gm" required>
    <textarea id="pDesc" placeholder="Description" required></textarea>
    <input type="file" id="pImage" accept="image/*">
    <button type="submit">Save Product</button>
  </form>
</div>
</div>

<script>
let products = [];
let editMode = false;

// Render product table
function renderTable(){
  const tbody = document.querySelector("#productTable tbody");
  tbody.innerHTML = "";
  let search = document.getElementById("searchBar").value.toLowerCase();
  let filter = document.getElementById("filterType").value;

  products.filter(p => 
    (p.name.toLowerCase().includes(search) || (p.huid && p.huid.toLowerCase().includes(search))) &&
    (filter==="" || p.jewellery_type===filter)
  ).forEach((p,i)=>{
    let tr = document.createElement("tr");
    let imgSrc = p.image ? "uploads/" + p.image : "uploads/default.png";
    tr.innerHTML = `
      <td data-label="Image"><img src="${imgSrc}" alt="${p.name}"></td>
      <td data-label="Name">${p.name}</td>
      <td data-label="Type">${p.type}</td>
      <td data-label="HUID">${p.huid || "-"}</td>
      <td data-label="Jewellery Type">${p.jewellery_type}</td>
      <td data-label="Weight">${p.weight || "-"}</td>
      <td data-label="Status">
        <button onclick="toggleStatus(${i})" class="${p.available==1?'active-btn':'inactive-btn'}">
          ${p.available==1?'Active':'Inactive'}
        </button>
      </td>
      <td data-label="Description">${p.description}</td>
      <td data-label="Edit"><button onclick="editProduct(${i})">Edit</button></td>
    `;
    tbody.appendChild(tr);
  });
}

// Toggle product status (instant update)
function toggleStatus(i){
  let product = products[i];
  let newStatus = product.available == 1 ? 0 : 1;

  fetch("toggle_status.php", {   // 👈 corrected filename
    method:"POST",
    headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body:`id=${product.id}&available=${newStatus}`
  })
  .then(res => res.json())
  .then(data => {
    if (data.success) {
      loadProductsFromDB();
    } else {
      alert("Status update failed: " + data.message);
    }
  })
  .catch(err => {
    console.error("Fetch error:", err);
    alert("Something went wrong. Check console.");
  });
}


// Modal open/close
function openModal(){ 
  document.getElementById("productModal").style.display="flex"; 
}
function closeModal(){ 
  document.getElementById("productModal").style.display="none"; 
  document.getElementById("productForm").reset();
  document.getElementById("pId").value="";
  document.getElementById("modalTitle").innerText="Add Product";
  editMode=false;
}

// Add/Edit product
document.getElementById("productForm").addEventListener("submit", function(e){
  e.preventDefault();

  const id=document.getElementById("pId").value;
  const name=document.getElementById("pName").value.trim();
  const type=document.getElementById("pType").value.trim();
  const huid=document.getElementById("pHuid").value.trim();
  const jewelleryType=document.getElementById("pJewelleryType").value;
  const weight=document.getElementById("pWeight").value.trim();
  const description=document.getElementById("pDesc").value.trim();
  const imgFile=document.getElementById("pImage").files[0];

  if(!name||!type||!huid||!jewelleryType||!description||weight<=0){
    alert("Please fill all fields and enter valid weight!");
    return;
  }

  let formData=new FormData();
  formData.append("name",name);
  formData.append("type",type);
  formData.append("huid",huid);
  formData.append("jewelleryType",jewelleryType);
  formData.append("weight",weight);
  formData.append("description",description);
  if(imgFile) formData.append("image",imgFile);
  if(id) formData.append("id",id); // for edit

  fetch(editMode ? "edit_product.php" : "add_product.php",{method:"POST",body:formData})
    .then(res=>res.json())
    .then(data=>{
      if(data.success || data.status==="success"){
        alert(editMode ? "Product updated successfully!" : "Product added successfully!");
        closeModal();
        loadProductsFromDB();
      } else { 
        alert("Error: "+(data.message || "Unknown error")); 
      }
    })
    .catch(err=>{
      console.error("Fetch error:",err);
      alert("Something went wrong. Check console.");
    });
});

// Edit product
function editProduct(i){
  let p = products[i];
  editMode=true;
  document.getElementById("modalTitle").innerText="Edit Product";
  document.getElementById("pId").value=p.id;
  document.getElementById("pName").value=p.name;
  document.getElementById("pType").value=p.type;
  document.getElementById("pHuid").value=p.huid;
  document.getElementById("pJewelleryType").value=p.jewellery_type;
  document.getElementById("pWeight").value=p.weight;
  document.getElementById("pDesc").value=p.description;
  openModal();
}

// Load products from DB
function loadProductsFromDB(){
  fetch("get_products.php")
    .then(res => res.json())
    .then(data => {
      products = data; 
      renderTable(); 
    })
    .catch(err => console.error("Load error:", err));
}

// Search and filter
document.getElementById("searchBar").addEventListener("input", renderTable);
document.getElementById("filterType").addEventListener("change", renderTable);

// Initial load
loadProductsFromDB();

// Logout
if(localStorage.getItem("isLoggedIn")!=="true"){ window.location.href="login.html"; }
function logout(){ localStorage.removeItem("isLoggedIn"); window.location.href="collection.php"; }
</script>

</body>
</html>
