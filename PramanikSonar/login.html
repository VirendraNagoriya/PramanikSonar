<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login Page</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    /* ✅ Navbar Base */
    nav {
      background: #800000;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
    }

    /* ✅ Logo */
    .nav-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      color: white;
      font-size: 20px;
      font-weight: bold;
      letter-spacing: 1px;
      text-decoration: none;
      font-family: 'Playfair Display', serif;
    }
    .nav-logo img {
      height: 40px;
    }

    /* ✅ Menu */
    .nav-links {
      display: flex;
      gap: 25px;
      align-items: center;
    }
    .nav-links a {
      color: white;
      text-decoration: none;
      font-weight: 600;
      font-family: 'Playfair Display', serif;
      transition: 0.3s;
    }
    .nav-links a:hover {
      color: #ffd700;
    }

    /* ✅ Login Button */
    .login-btn {
      color: #800000 !important;
      background: white;
      padding: 6px 15px;
      border-radius: 5px;
      font-weight: bold;
    }

    /* ✅ Hamburger */
    .hamburger {
      display: none;
      flex-direction: column;
      cursor: pointer;
    }
    .hamburger div {
      width: 25px;
      height: 3px;
      background: white;
      margin: 5px 0;
      transition: 0.4s;
    }

    /* ✅ Mobile View */
    @media (max-width: 768px) {
      .nav-links {
        display: none;
        flex-direction: column;
        width: 100%;
        background: black;
        padding: 15px 0;
        text-align: center;
      }
      .nav-links.active {
        display: flex;
      }
      .hamburger {
        display: flex;
      }
    }
  </style>
</head>
<body style="font-family: Arial, sans-serif; background: #f5f5f5; margin:0;">

  <!-- ✅ Navbar -->
  <nav>
    <!-- Left Logo / Brand -->
    <a href="index.html" class="nav-logo">
      <img src="images/logo file/icononly_transparent_nobuffer.png" alt="Logo">
      PRAMANIK SONAR
    </a>

    <!-- Hamburger -->
    <div class="hamburger" onclick="toggleMenu()">
      <div></div>
      <div></div>
      <div></div>
    </div>

    <!-- Right Menu -->
    <div class="nav-links" id="navLinks">
      <a href="index.html">HOME</a>
      <a href="about.html">ABOUT US</a>
      <a href="offers.html">OFFERS</a>
      <a href="collection.php">COLLECTION</a>
      <a href="blog.html">BLOG</a>
      <a href="contact.html">CONTACT</a>
      <a href="login.html" class="login-btn">LOGIN</a>
    </div>
  </nav>

  <script>
    function toggleMenu() {
      document.getElementById("navLinks").classList.toggle("active");
    }
  </script>


  <!-- ✅ Login Box -->
  <div style="background: white; padding: 30px; border-radius: 10px; width: 300px; box-shadow: 0 4px 8px rgba(0,0,0,0.2); margin:50px auto;">
    <h2 style="text-align:center; font-family: Playfair Display;  color: #800000;">Login</h2>
    
    <form onsubmit="return validateLogin()" style="display: flex; flex-direction: column;">
      <label for="username" style="margin-bottom: 5px; font-weight: bold;">Username</label>
      <input type="text" id="username" required style="padding: 8px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 5px;">

      <label for="password" style="margin-bottom: 5px; font-weight: bold;">Password</label>
      <input type="password" id="password" required style="padding: 8px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 5px;">

      <button type="submit"  style="padding: 10px; background: #800000; color: white;  font-family: Playfair Display; border: none; border-radius: 5px; cursor: pointer;">
        Login
      </button>
    </form>
  </div>

  <!-- ✅ JS -->
  <script>
  function validateLogin() {
    let username = document.getElementById("username").value;
    let password = document.getElementById("password").value;

    if (username === "admin" && password === "1234") {
      localStorage.setItem("isLoggedIn", "true"); 
      window.location.href = "products.html"; 
      return false;
    } else {
      alert("Invalid Username or Password");
      return false;
    }
  }
  </script>

</body>
</html>
