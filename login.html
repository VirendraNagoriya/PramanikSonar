<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login Page</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="font-family: Arial, sans-serif; background: #f5f5f5; margin:0;">

  <!-- ✅ Navbar -->
  <nav style="background:#800000; padding:10px 20px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap;">
    <a href="index.html" style="color:white; font-size:20px; font-weight:bold; text-decoration:none;">Pramanik Sonar</a>
    <div style="display:flex; flex-wrap:wrap; gap:15px;">
      <a href="index.html" style="color:white; text-decoration:none;">Home</a>
      <a href="about.html" style="color:white; text-decoration:none;">About</a>
      <a href="offers.html" style="color:white; text-decoration:none;">Offers</a>
      <a href="collection.html" style="color:white; text-decoration:none;">Collection</a>
      <a href="blog.html" style="color:white; text-decoration:none;">Blog</a>
      <a href="contact.html" style="color:white; text-decoration:none;">Contact</a>
      <a href="login.html" style="color:#800000; background:white; padding:5px 12px; border-radius:5px; text-decoration:none; font-weight:bold;">Login</a>
    </div>
  </nav>

  <!-- ✅ Login Box -->
  <div style="background: white; padding: 30px; border-radius: 10px; width: 300px; box-shadow: 0 4px 8px rgba(0,0,0,0.2); margin:50px auto;">
    <h2 style="text-align:center; color: #800000;">Login</h2>
    
    <form onsubmit="return validateLogin()" style="display: flex; flex-direction: column;">
      <label for="username" style="margin-bottom: 5px; font-weight: bold;">Username</label>
      <input type="text" id="username" required style="padding: 8px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 5px;">

      <label for="password" style="margin-bottom: 5px; font-weight: bold;">Password</label>
      <input type="password" id="password" required style="padding: 8px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 5px;">

      <button type="submit" style="padding: 10px; background: #800000; color: white; border: none; border-radius: 5px; cursor: pointer;">
        Login
      </button>
    </form>
  </div>

  <!-- ✅ JS -->
  <script>
  function validateLogin() {
    let username = document.getElementById("username").value;
    let password = document.getElementById("password").value;

    if (username === "admin" && password === "1234") {
      localStorage.setItem("isLoggedIn", "true"); 
      window.location.href = "products.html"; 
      return false;
    } else {
      alert("Invalid Username or Password");
      return false;
    }
  }
  </script>

</body>
</html>
