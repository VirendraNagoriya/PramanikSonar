<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Gold Products</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    h2 {
      text-align: center;
      color: #800000;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin-bottom: 20px;
    }
    .controls input, .controls select, .controls button {
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 14px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 10px;
      text-align: center;
      font-size: 14px;
    }
    th {
      background-color: #800000;
      color: white;
    }
    img {
      max-width: 60px;
      border-radius: 6px;
    }
    button {
      padding: 6px 12px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    .active-btn { background: green; color: #fff; }
    .inactive-btn { background: red; color: #fff; }
    /* Modal */
    .modal {
      display: none;
      position: fixed;
      z-index: 999;
      left: 0; top: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
    }
    .modal-content {
      background: #fff;
      padding: 20px;
      border-radius: 10px;
      width: 90%;
      max-width: 400px;
    }
    .modal-content input, .modal-content select, .modal-content textarea {
      width: 100%;
      margin: 8px 0;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    .modal-content button {
      width: 100%;
      padding: 10px;
      background: #800000;
      color: #fff;
    }
    @media(max-width:768px){
      table, thead, tbody, th, td, tr { 
        display: block; 
      }
      tr { margin-bottom: 15px; }
      td {
        text-align: right;
        padding-left: 50%;
        position: relative;
      }
      td::before {
        content: attr(data-label);
        position: absolute;
        left: 10px;
        width: 45%;
        padding-left: 10px;
        font-weight: bold;
        text-align: left;
      }
    }
  </style>
</head>
<body>

<button onclick="logout()">Logout</button>
<h2>Gold Products</h2>

<div class="controls">
  <input type="text" id="searchBar" placeholder="Search by Name / HUID">
  <select id="filterType">
    <option value="">Filter by Jewellery Type</option>
    <option value="Ring">Ring</option>
    <option value="Necklace">Necklace</option>
    <option value="Bracelet">Bracelet</option>
  </select>
  <button onclick="openModal()">+ Add Product</button>
</div>

<table id="productTable">
  <thead>
    <tr>
      <th>Image</th>
      <th>Name</th>
      <th>Type</th>
      <th>HUID</th>
      <th>Jewellery Type</th>
      <th>Weight (gm)</th>
      <th>Status</th>
      <th>Description</th>
      <th>Edit</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<!-- Add Product Modal -->
<div class="modal" id="productModal">
  <div class="modal-content">
    <h3>Add Product</h3>
    <input type="text" id="pName" placeholder="Product Name">
    <input type="text" id="pType" placeholder="Type">
    <input type="text" id="pHuid" placeholder="HUID No">
    <select id="pJewelleryType">
      <option value="">Select Jewellery Type</option>
      <option value="Ring">Ring</option>
      <option value="Necklace">Necklace</option>
      <option value="Bracelet">Bracelet</option>
    </select>
    <input type="number" id="pWeight" placeholder="Weight in gm">
    <textarea id="pDesc" placeholder="Description"></textarea>
    <input type="file" id="pImage" accept="image/*">
    <button onclick="addProduct()">Save Product</button>
  </div>
</div>

<script>
  let products = [
    {name:"Gold Ring", type:"Jewellery", huid:"H123", jewelleryType:"Ring", weight:5, available:true, description:"24k Gold Ring", image:"https://via.placeholder.com/60"},
    {name:"Gold Necklace", type:"Jewellery", huid:"H456", jewelleryType:"Necklace", weight:15, available:false, description:"18k Gold Necklace", image:"https://via.placeholder.com/60"}
  ];

  function renderTable(){
    const tbody = document.querySelector("#productTable tbody");
    tbody.innerHTML = "";

    let search = document.getElementById("searchBar").value.toLowerCase();
    let filter = document.getElementById("filterType").value;

    products.filter(p => 
      (p.name.toLowerCase().includes(search) || p.huid.toLowerCase().includes(search)) &&
      (filter==="" || p.jewelleryType===filter)
    ).forEach((p, index) => {
      let tr = document.createElement("tr");
      tr.innerHTML = `
        <td data-label="Image"><img src="${p.image}" alt="${p.name}"></td>
        <td data-label="Name">${p.name}</td>
        <td data-label="Type">${p.type}</td>
        <td data-label="HUID">${p.huid}</td>
        <td data-label="Jewellery Type">${p.jewelleryType}</td>
        <td data-label="Weight">${p.weight}</td>
        <td data-label="Status">
          <button onclick="toggleStatus(${index})" class="${p.available ? 'active-btn' : 'inactive-btn'}">
            ${p.available ? 'Active' : 'Inactive'}
          </button>
        </td>
        <td data-label="Description">${p.description}</td>
        <td data-label="Edit"><button onclick="editProduct(${index})">Edit</button></td>
      `;
      tbody.appendChild(tr);
    });
  }

  function toggleStatus(i){
    products[i].available = !products[i].available;
    renderTable();
  }

  function openModal(){ document.getElementById("productModal").style.display="flex"; }
  function closeModal(){ document.getElementById("productModal").style.display="none"; }

  function addProduct(){
    const name = document.getElementById("pName").value;
    const type = document.getElementById("pType").value;
    const huid = document.getElementById("pHuid").value;
    const jewelleryType = document.getElementById("pJewelleryType").value;
    const weight = document.getElementById("pWeight").value;
    const description = document.getElementById("pDesc").value;
    const imgFile = document.getElementById("pImage").files[0];
    const imgURL = imgFile ? URL.createObjectURL(imgFile) : "https://via.placeholder.com/60";

    if(name && type && huid){
      products.push({name, type, huid, jewelleryType, weight, available:true, description, image:imgURL});
      closeModal();
      renderTable();
    } else {
      alert("Fill mandatory fields!");
    }
  }

  function editProduct(i){
    alert("Edit function can be added here. Currently editing product: " + products[i].name);
  }

  document.getElementById("searchBar").addEventListener("input", renderTable);
  document.getElementById("filterType").addEventListener("change", renderTable);

  renderTable();
</script>
<script>
  // If not logged in, redirect to login
  if (localStorage.getItem("isLoggedIn") !== "true") {
    window.location.href = "login.html";
  }

  // Logout function
  function logout() {
    localStorage.removeItem("isLoggedIn");
    window.location.href = "collection.html";
  }
</script>

</body>
</html>
